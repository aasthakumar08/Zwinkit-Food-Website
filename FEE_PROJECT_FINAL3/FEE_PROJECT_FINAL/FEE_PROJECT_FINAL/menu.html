<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant Menu - Zwinkit</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f7eee0;
            color: #4a2c1a;
        }

        header {
            background: rgb(72, 41, 3);
            color: burlywood;
            padding: 20px 35px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h2 {
            font-size: 30px;
        }

        header a {
            color: white;
            text-decoration: none;
        }

        .container {
            max-width: 1000px;
            margin: 30px auto;
            padding: 20px;
        }

        #restaurant-name {
            margin-bottom: 8px;
            font-size: 32px;
        }

        .subtitle {
            margin-bottom: 25px;
            color: #76563d;
        }

        #menu-items {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 20px;
        }

        .menu-card {
            background: white;
            padding: 22px;
            border-radius: 15px;
            box-shadow: 0 4px 12px #00000012;
        }

        .menu-card h3 {
            margin-bottom: 10px;
        }

        .menu-card p {
            margin-bottom: 15px;
            color: #76563d;
        }

        .price {
            font-weight: bold;
            font-size: 19px;
            margin-bottom: 15px;
        }

        button {
            background: #7b421b;
            color: white;
            border: none;
            padding: 11px 16px;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            background: #542b16;
        }

        .cart-link {
            display: inline-block;
            margin-top: 25px;
            background: #7b421b;
            padding: 13px 20px;
            border-radius: 9px;
        }

        @media (max-width: 600px) {
            #menu-items {
                grid-template-columns: 1fr;
            }

            header {
                padding: 18px;
            }

            #restaurant-name {
                font-size: 26px;
            }
        }
    </style>
</head>

<body>

<header>
    <h2>Zwinkit</h2>
    <a href="Cart.html">🛒 View Cart</a>
</header>

<div class="container">
    <h1 id="restaurant-name">Restaurant Menu</h1>
    <p class="subtitle">Choose your favourite food and add it to your cart.</p>

    <div id="menu-items"></div>

    <a class="cart-link" href="Cart.html" style="color:white;text-decoration:none">
        Go to Cart 🛒
    </a>
</div>

<script>
    const menus = {
        "friends-dhaba": {
            name: "Friend's Dhaba",
            items: [
                { name: "Butter Chicken", price: 280, desc: "Rich and creamy chicken curry" },
                { name: "Dal Makhani", price: 180, desc: "Slow-cooked black lentils" },
                { name: "Paneer Butter Masala", price: 220, desc: "Paneer in creamy tomato gravy" },
                { name: "Butter Naan", price: 40, desc: "Soft naan with butter" },
                { name: "Amritsari Kulcha", price: 120, desc: "Stuffed Punjabi kulcha" },
                { name: "Veg Thali", price: 200, desc: "A complete Punjabi meal" }
            ]
        },

        "under-the-mango-tree": {
            name: "Under The Mango Tree",
            items: [
                { name: "Paneer Tikka", price: 240, desc: "Smoky tandoori paneer" },
                { name: "Malai Kofta", price: 230, desc: "Creamy curry with kofta" },
                { name: "Shahi Paneer", price: 250, desc: "Paneer in rich royal gravy" },
                { name: "Tandoori Roti", price: 25, desc: "Freshly baked roti" },
                { name: "Veg Biryani", price: 190, desc: "Fragrant rice with spices" },
                { name: "Gulab Jamun", price: 80, desc: "Sweet dessert, 2 pieces" }
            ]
        },

        "salsa-spice-grill": {
            name: "Salsa Spice & Grill",
            items: [
                { name: "Margherita Pizza", price: 249, desc: "Classic cheese pizza" },
                { name: "Grilled Sandwich", price: 160, desc: "Grilled vegetable sandwich" },
                { name: "White Sauce Pasta", price: 220, desc: "Creamy Italian pasta" },
                { name: "Veg Burger", price: 149, desc: "Crispy burger with fresh veggies" },
                { name: "Paneer Tikka Pizza", price: 299, desc: "Pizza topped with paneer tikka" },
                { name: "Cold Coffee", price: 120, desc: "Chilled creamy coffee" }
            ]
        }
    };

    const params = new URLSearchParams(window.location.search);
    const restaurantId = params.get("restaurant");
    const restaurant = menus[restaurantId];

    const heading = document.getElementById("restaurant-name");
    const menuContainer = document.getElementById("menu-items");

    if (!restaurant) {
        heading.textContent = "Restaurant not found";
    } else {
        heading.textContent = restaurant.name;
        document.title = restaurant.name + " - Zwinkit";

        restaurant.items.forEach(function (item) {
            const card = document.createElement("div");
            card.className = "menu-card";

            const title = document.createElement("h3");
            title.textContent = item.name;

            const description = document.createElement("p");
            description.textContent = item.desc;

            const price = document.createElement("div");
            price.className = "price";
            price.textContent = "₹" + item.price;

            const button = document.createElement("button");
            button.textContent = "Add to Cart +";

            button.addEventListener("click", function () {
                let cart = JSON.parse(localStorage.getItem("zwinkitCart")) || [];

                const existingItem = cart.find(function (cartItem) {
                    return cartItem.restaurantId === restaurantId &&
                           cartItem.name === item.name;
                });

                if (existingItem) {
                    existingItem.quantity++;
                } else {
                    cart.push({
                        restaurantId: restaurantId,
                        restaurant: restaurant.name,
                        name: item.name,
                        price: item.price,
                        quantity: 1
                    });
                }

                localStorage.setItem("zwinkitCart", JSON.stringify(cart));

                button.textContent = "Added ✓";
                setTimeout(function () {
                    button.textContent = "Add to Cart +";
                }, 1000);
            });

            card.append(title, description, price, button);
            menuContainer.appendChild(card);
        });
    }
</script>

</body>
</html>
