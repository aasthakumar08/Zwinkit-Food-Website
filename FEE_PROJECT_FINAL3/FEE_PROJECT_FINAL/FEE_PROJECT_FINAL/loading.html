<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Zwinkit</title>

    <meta http-equiv="refresh" content="3;url=Login.html">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;
            overflow: hidden;
            font-family: "Bricolage Grotesque", sans-serif;
        }

        .loader {
            min-height: 100vh;
            min-height: 100dvh;
            width: 100%;
            background: #482903;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
            padding: 30px 20px;
        }

        /* Three animated circles */

        .circle {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 1;
            animation: zoomCircles 2s ease-in-out infinite alternate;
            will-change: transform;
        }

        .circle-1 {
            width: min(300px, 55vw);
            height: min(300px, 55vw);
            border: 2px solid rgba(230, 200, 156, 0.18);
            animation-delay: 0s;
        }

        .circle-2 {
            width: min(470px, 80vw);
            height: min(470px, 80vw);
            border: 2px solid rgba(230, 200, 156, 0.12);
            animation-delay: 0.15s;
        }

        .circle-3 {
            width: min(680px, 110vw);
            height: min(680px, 110vw);
            border: 2px solid rgba(230, 200, 156, 0.08);
            animation-delay: 0.3s;
        }

        @keyframes zoomCircles {

            from {
                transform: translate(-50%, -50%) scale(1);
            }

            to {
                transform: translate(-50%, -50%) scale(1.08);
            }

        }

        .content {
            width: min(600px, 100%);
            text-align: center;
            position: relative;
            z-index: 5;
        }

        .logo-image {
            width: clamp(110px, 15vw, 180px);
            height: clamp(110px, 15vw, 180px);
            object-fit: cover;
            border-radius: 50%;
            display: block;
            margin: 0 auto clamp(22px, 3vw, 35px) auto;
        }

        .brand-name {
            color: #fff4e5;
            font-size: clamp(38px, 6vw, 66px);
            font-weight: 800;
            letter-spacing: clamp(6px, 1.1vw, 12px);
            margin-left: clamp(6px, 1.1vw, 12px);
            line-height: 1;
            white-space: nowrap;
        }

        .tagline {
            color: #e6c89c;
            font-size: clamp(9px, 1.4vw, 16px);
            letter-spacing: clamp(3px, 0.6vw, 7px);
            margin-top: clamp(14px, 2vw, 22px);
            margin-bottom: clamp(35px, 5vw, 58px);
        }

        .loading-container {
            width: min(700px, 90vw);
            margin: auto;
        }

        .loading-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            color: #f0d8b5;
            font-size: clamp(10px, 1.3vw, 15px);
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .loading-bar {
            width: 100%;
            height: clamp(8px, 1.2vw, 12px);
            background: rgba(255, 244, 229, 0.18);
            border-radius: 20px;
            overflow: hidden;
        }

        .progress {
            width: 0%;
            height: 100%;
            background: #e6c89c;
            border-radius: 20px;
            animation: loading 3s linear forwards;
        }

        @keyframes loading {

            from {
                width: 0%;
            }

            to {
                width: 100%;
            }

        }

        .message {
            color: #f0d8b5;
            font-size: clamp(11px, 1.4vw, 16px);
            letter-spacing: 1px;
            margin-top: clamp(17px, 2.5vw, 25px);
            animation: fade 1.5s ease-in-out infinite alternate;
        }

        @keyframes fade {

            from {
                opacity: 0.5;
            }

            to {
                opacity: 1;
            }

        }

        .bottom {
            position: absolute;
            bottom: clamp(20px, 4vh, 45px);
            left: 20px;
            right: 20px;
            text-align: center;
            color: #c8a982;
            font-size: clamp(7px, 1vw, 12px);
            letter-spacing: clamp(2px, 0.5vw, 5px);
            z-index: 5;
        }

        @media (max-width: 900px) {

            .loader {
                padding: 25px 18px;
            }

            .content {
                width: 92%;
            }

            .loading-container {
                width: 90%;
            }

        }

        @media (max-width: 600px) {

            .loader {
                padding: 20px 15px;
            }

            .content {
                width: 100%;
            }

            .logo-image {
                width: clamp(100px, 28vw, 135px);
                height: clamp(100px, 28vw, 135px);
                margin-bottom: 25px;
            }

            .brand-name {
                font-size: clamp(34px, 11vw, 48px);
                letter-spacing: clamp(5px, 1.8vw, 8px);
                margin-left: clamp(5px, 1.8vw, 8px);
            }

            .tagline {
                font-size: clamp(8px, 2.5vw, 11px);
                letter-spacing: clamp(2px, 1vw, 4px);
                margin-top: 15px;
                margin-bottom: 38px;
            }

            .loading-container {
                width: 90%;
                max-width: 500px;
            }

            .loading-top {
                font-size: clamp(9px, 2.8vw, 12px);
                gap: 10px;
            }

            .loading-bar {
                height: 9px;
            }

            .message {
                font-size: clamp(10px, 3vw, 13px);
                margin-top: 18px;
            }

            .bottom {
                bottom: 20px;
                font-size: clamp(6px, 2vw, 9px);
                letter-spacing: clamp(1.5px, 0.8vw, 3px);
            }

            .circle-1 {
                width: 300px;
                height: 300px;
            }

            .circle-2 {
                width: 400px;
                height: 400px;
            }

            .circle-3 {
                width: 500px;
                height: 500px;
            }

        }

        @media (max-width: 380px) {

            .loader {
                padding: 15px 10px;
            }

            .logo-image {
                width: 95px;
                height: 95px;
                margin-bottom: 20px;
            }

            .brand-name {
                font-size: 31px;
                letter-spacing: 4px;
                margin-left: 4px;
            }

            .tagline {
                font-size: 7px;
                letter-spacing: 2.5px;
                margin-top: 13px;
                margin-bottom: 32px;
            }

            .loading-container {
                width: 92%;
            }

            .loading-top {
                font-size: 8px;
            }

            .loading-bar {
                height: 8px;
            }

            .message {
                font-size: 9px;
                margin-top: 15px;
            }

            .bottom {
                bottom: 15px;
                font-size: 6px;
                letter-spacing: 1.5px;
            }

        }

        @media (max-height: 600px) {

            .loader {
                padding-top: 10px;
                padding-bottom: 10px;
            }

            .logo-image {
                width: clamp(80px, 16vh, 130px);
                height: clamp(80px, 16vh, 130px);
                margin-bottom: 15px;
            }

            .tagline {
                margin-top: 10px;
                margin-bottom: 25px;
            }

            .message {
                margin-top: 12px;
            }

            .bottom {
                bottom: 10px;
            }

        }

    </style>

</head>

<body>

    <div class="loader">

        <div class="circle circle-1"></div>
        <div class="circle circle-2"></div>
        <div class="circle circle-3"></div>

        <div class="content">

            <img src="images/Logo.jpeg" alt="Zwinkit Logo" class="logo-image">

            <div class="brand-name">
                ZWINKIT
            </div>

            <div class="tagline">
                GOOD FOOD. GREAT MOOD.
            </div>

            <div class="loading-container">

                <div class="loading-top">
                    <span>Getting things ready...</span>
                    <span>Loading...</span>
                </div>

                <div class="loading-bar">
                    <div class="progress"></div>
                </div>

                <div class="message">
                    Preparing your cravings...
                </div>

            </div>

        </div>

        <div class="bottom">
            YOUR FOOD • YOUR MOOD • ZWINKIT
        </div>

    </div>

</body>

</html>
